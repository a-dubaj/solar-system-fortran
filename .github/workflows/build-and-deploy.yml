name: Build and deploy solar system simulation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install git and curl (if missing in the container)
        run: |
          apt-get update
          apt-get install -y git curl python3

      - name: Install Emscripten SDK
        run: |
          rm -rf /opt/emsdk-build
          git clone https://github.com/emscripten-core/emsdk.git /opt/emsdk-build
          cd /opt/emsdk-build
          ./emsdk install latest
          ./emsdk activate latest

      - name: Locate the flang compiler inside the image
        run: |
          echo "Searching for flang/flang-new binary..."
          find /opt/flang -maxdepth 6 -type f \( -iname 'flang-new' -o -iname 'flang' \) 2>/dev/null | tee /tmp/flang_paths.txt
          if [ ! -s /tmp/flang_paths.txt ]; then
            echo "Not found under /opt/flang, searching whole filesystem..."
            find / -maxdepth 6 -type f \( -iname 'flang-new' -o -iname 'flang' \) 2>/dev/null | tee /tmp/flang_paths.txt
          fi
          echo "Also searching for the Fortran WASM runtime library..."
          find /opt/flang / -maxdepth 6 -iname 'libFortranRuntime*' 2>/dev/null | tee /tmp/runtime_paths.txt

      - name: Compile Fortran module to a WebAssembly object file
        run: |
          cd /opt/emsdk-build && . ./emsdk_env.sh
          cd "$GITHUB_WORKSPACE"
          FLANG_BIN=$(head -n1 /tmp/flang_paths.txt)
          echo "Using flang binary: $FLANG_BIN"
          "$FLANG_BIN" --target=wasm32-unknown-emscripten \
            -c fortran/orbital_mechanics.f90 \
            -o orbital_mechanics.o

      - name: Link with Emscripten into a browser-ready WASM module
        run: |
          cd /opt/emsdk-build && . ./emsdk_env.sh
          cd "$GITHUB_WORKSPACE"
          RUNTIME_LIB=$(head -n1 /tmp/runtime_paths.txt)
          echo "Using runtime library: $RUNTIME_LIB"
          emcc orbital_mechanics.o "$RUNTIME_LIB" \
            -o web/orbital_mechanics.js \
            -s EXPORTED_FUNCTIONS="['_get_position','_get_body_count','_get_body_radius_km','_get_orbital_period_days','_get_moon_count','_get_moon_position_unit','_malloc','_free']" \
            -s EXPORTED_RUNTIME_METHODS="['cwrap','ccall','HEAPF64']" \
            -s ALLOW_MEMORY_GROWTH=1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4