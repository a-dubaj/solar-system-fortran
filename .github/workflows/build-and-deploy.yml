name: Build and deploy solar system simulation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install git and curl (if missing in the container)
        run: |
          apt-get update
          apt-get install -y git curl python3

      - name: Install Emscripten SDK
        run: |
          rm -rf /opt/emsdk-build
          git clone https://github.com/emscripten-core/emsdk.git /opt/emsdk-build
          cd /opt/emsdk-build
          ./emsdk install latest
          ./emsdk activate latest

      - name: Compile Fortran module to a WebAssembly object file
        run: |
          source /opt/emsdk-build/emsdk_env.sh
          export PATH="/opt/flang/host/bin:$PATH"
          flang-new --target=wasm32-unknown-emscripten \
            -c fortran/orbital_mechanics.f90 \
            -o orbital_mechanics.o

      - name: Link with Emscripten into a browser-ready WASM module
        run: |
          source /opt/emsdk-build/emsdk_env.sh
          emcc orbital_mechanics.o /opt/flang/wasm/libFortranRuntime.a \
            -o web/orbital_mechanics.js \
            -s EXPORTED_FUNCTIONS="['_get_position','_get_body_count','_get_body_radius_km','_get_orbital_period_days','_malloc','_free']" \
            -s EXPORTED_RUNTIME_METHODS="['cwrap','ccall']" \
            -s ALLOW_MEMORY_GROWTH=1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4